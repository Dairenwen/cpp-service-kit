<!DOCTYPE html>
<html lang="zh-CN" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="x-apple-disable-message-reformatting">
  <title>Breeze · 安全验证码</title>
  <!--
    动态验证码邮件模板
    唯一需要替换的业务占位符位于验证码区域
    动效：CSS 动画为主，浏览器内另有真实倒计时增强。
    邮件安全：页面内容在 JS / animation 被邮件客户端屏蔽时仍保持完整可读。
    注意：倒计时动画只是展示层，真实有效期须由服务端校验。
  -->
  <!--[if mso]>
  <style>
    body, table, td, p, span {font-family: 'Microsoft YaHei', Arial, sans-serif !important;}
  </style>
  <![endif]-->
  <style>
    :root {
      color-scheme: dark;
      --violet: #8b83ff;
      --lilac: #b2a6ff;
      --cyan: #64d7ff;
      --fg: #f5f4ff;
      --muted: #a0a1b9;
    }
    * {box-sizing: border-box; -webkit-text-size-adjust: 100%;}
    html, body {margin:0; padding:0; min-height:100%; width:100%;}
    body {
      background-color:#070910;
      color:#f5f4ff;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    table {border-spacing:0; border-collapse:collapse;}
    td {mso-table-lspace:0; mso-table-rspace:0;}
    img {border:0; outline:none; text-decoration:none;}

    /* 1. 永续渐变背景流动 */
    @keyframes auroraDrift {
      0%,100% { background-position:0% 0%,100% 100%,30% 90%; }
      50% { background-position:45% 25%,55% 75%,75% 20%; }
    }
    .page-shell {
      min-height:100vh;
      background-color:#070910;
      background-image:
        radial-gradient(ellipse 74% 63% at 5% 0%, rgba(107,74,234,.26), transparent 70%),
        radial-gradient(ellipse 76% 72% at 94% 95%, rgba(30,141,196,.15), transparent 70%),
        radial-gradient(ellipse 48% 42% at 52% 42%, rgba(117,50,187,.11), transparent 74%);
      background-size:140% 145%,155% 140%,170% 155%;
      background-position:0% 0%,100% 100%,30% 90%;
      animation:auroraDrift 16s ease-in-out infinite;
    }

    /* 2. 卡片入场 */
    @keyframes cardEnter {
      0% { opacity:0; transform:translateY(35px) scale(.966); }
      100% { opacity:1; transform:translateY(0) scale(1); }
    }
    .main-card {
      position:relative;
      overflow:hidden;
      border:1px solid #2c2b4b;
      border-radius:28px;
      box-shadow:0 26px 96px rgba(0,0,0,.55),0 0 72px rgba(110,89,245,.10);
      animation:cardEnter .9s cubic-bezier(.2,.75,.2,1) both;
    }

    /* 3. 顶部流光 */
    @keyframes bandShine {
      0% {background-position:180% 50%;}
      100% {background-position:-180% 50%;}
    }
    .light-bar {
      height:4px;
      background-color:#8b83ff;
      background-image:linear-gradient(95deg,#6f62e8 0%,#a89eff 25%,#66ddff 50%,#b8a8ff 75%,#6f62e8 100%);
      background-size:270% 100%;
      animation:bandShine 5s linear infinite;
    }

    /* 4. 光球漂浮 */
    @keyframes orbFloatA {
      0%,100% {transform:translate(0,0) scale(1);opacity:.38;}
      50% {transform:translate(16px,26px) scale(1.12);opacity:.64;}
    }
    @keyframes orbFloatB {
      0%,100% {transform:translate(0,0) scale(1);opacity:.18;}
      50% {transform:translate(-19px,-22px) scale(1.18);opacity:.36;}
    }
    .orb-a,.orb-b {position:absolute;pointer-events:none;border-radius:50%;filter:blur(8px);}
    .orb-a {width:190px;height:190px;right:-70px;top:0;background:radial-gradient(circle,#7f6cfa 0%,rgba(127,108,250,0) 72%);opacity:.38;animation:orbFloatA 7.5s ease-in-out infinite;}
    .orb-b {width:210px;height:210px;left:-115px;bottom:15px;background:radial-gradient(circle,#2ab3dd 0%,rgba(42,179,221,0) 68%);opacity:.18;animation:orbFloatB 10s ease-in-out infinite;}

    /* 5. 验证码容器呼吸，外部光圈扩散 */
    @keyframes haloRipple {
      0%,100% {box-shadow:0 0 0 0 rgba(141,124,255,.21),0 0 35px rgba(112,95,229,.10),inset 0 0 25px rgba(141,124,255,.065);}
      55% {box-shadow:0 0 0 14px rgba(141,124,255,0),0 0 60px rgba(112,95,229,.24),inset 0 0 36px rgba(141,124,255,.14);}
    }
    .code-shell {
      position:relative;overflow:hidden;
      background-color:#171729;
      background-image:linear-gradient(138deg,rgba(119,102,248,.13),rgba(64,188,232,.035));
      border:1px solid #48416e;
      border-radius:22px;
      animation:haloRipple 3.4s ease-in-out infinite;
    }

    /* 6. 验证码文字持续发光 */
    @keyframes numberGlow {
      0%,100% {text-shadow:0 0 12px rgba(139,131,255,.42),0 0 33px rgba(100,215,255,.10);transform:scale(1);}
      50% {text-shadow:0 0 26px rgba(139,131,255,.92),0 0 62px rgba(100,215,255,.39);transform:scale(1.035);}
    }
    .code-number {
      display:block;
      color:#dcd9ff;
      font-size:46px;font-weight:800;letter-spacing:10px;line-height:1.22;
      white-space:nowrap;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
      animation:numberGlow 2.7s ease-in-out infinite;
    }

    /* 7. 扫描流光划过验证码 */
    @keyframes scanSweep {
      from {transform:translateX(-155%) skewX(-18deg);}
      to {transform:translateX(255%) skewX(-18deg);}
    }
    .scan-beam {
      position:absolute;left:0;top:0;bottom:0;width:46%;pointer-events:none;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
      animation:scanSweep 4.8s ease-in-out 1s infinite;
    }

    /* 8. 安全图标呼吸 */
    @keyframes badgePulse {
      0%,100% {box-shadow:0 0 0 0 rgba(74,222,128,.13);}
      50% {box-shadow:0 0 0 7px rgba(74,222,128,0);}
    }
    .secure-badge {animation:badgePulse 2.6s ease-in-out infinite;}
    @keyframes dotBlink {0%,100%{opacity:1;}50%{opacity:.25;}}
    .status-dot {animation:dotBlink 1.8s ease-in-out infinite;}

    /* 9. 10 分钟有效期进度动画（浏览器 JS 同步剩余宽度） */
    @keyframes progressDeplete {from{width:100%;}to{width:0%;}}
    .progress-fill {
      height:100%;width:100%;border-radius:100px;
      background:#8b83ff;
      background-image:linear-gradient(90deg,#6f69f4,#ab91ff,#65d5fa);
      animation:progressDeplete 600s linear forwards;
      box-shadow:0 0 16px rgba(139,131,255,.44);
    }
    @keyframes tinyFloat {
      0%,100% {transform:translateY(8px);opacity:.1;}
      50% {transform:translateY(-14px);opacity:.55;}
    }
    .spark {position:absolute;z-index:0;width:4px;height:4px;border-radius:50%;background:#a59dff;pointer-events:none;animation:tinyFloat 5s ease-in-out infinite;}
    .spark.s1 {left:7%;top:19%;animation-delay:-1s;}
    .spark.s2 {right:10%;top:33%;animation-delay:-3s;background:#6fe0ff;}
    .spark.s3 {left:13%;bottom:26%;animation-delay:-2s;}
    .spark.s4 {right:18%;bottom:15%;animation-delay:-4s;background:#6fe0ff;}

    @media screen and (max-width:640px) {
      .outer-pad {padding:28px 14px 36px !important;}
      .card-body {padding:34px 25px 24px !important;}
      .card-footer {padding:0 25px 27px !important;}
      .main-card {border-radius:20px !important;}
      .heading {font-size:27px !important;}
      .code-number {font-size:32px !important;letter-spacing:6px !important;}
      .code-inner {padding:28px 12px 25px !important;}
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after {animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#070910;color:#f5f4ff;">
  <div class="page-shell" style="min-height:100vh;background-color:#070910;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;">
      <tr>
        <td align="center" class="outer-pad" style="padding:60px 18px 64px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" class="main-card" style="width:100%;max-width:560px;border-collapse:separate;background-color:#10111d;background-image:linear-gradient(160deg,#171728 0%,#0c0e18 100%);border:1px solid #2c2b4b;border-radius:28px;overflow:hidden;">
            <tr><td style="padding:0;" colspan="1"><div class="light-bar" style="height:4px;background-color:#8b83ff;"></div></td></tr>
            <tr>
              <td class="card-body" style="position:relative;padding:43px 45px 30px;">
                <div class="orb-a" aria-hidden="true"></div>
                <div class="orb-b" aria-hidden="true"></div>
                <span class="spark s1" aria-hidden="true"></span>
                <span class="spark s2" aria-hidden="true"></span>
                <span class="spark s3" aria-hidden="true"></span>
                <span class="spark s4" aria-hidden="true"></span>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;position:relative;z-index:1;">
                  <tr>
                    <td align="left" valign="middle">
                      <table role="presentation" cellpadding="0" cellspacing="0"><tr>
                        <td width="44" height="44" align="center" valign="middle" style="width:44px;height:44px;border-radius:14px;background-color:#7469e8;background-image:linear-gradient(140deg,#7267f1,#a283ff);color:white;font-size:23px;font-weight:800;box-shadow:0 6px 22px rgba(126,106,248,.27);">B</td>
                        <td valign="middle" style="padding-left:12px;font-size:19px;font-weight:760;letter-spacing:.3px;color:#f2f0ff;">Breeze</td>
                      </tr></table>
                    </td>
                    <td align="right" valign="middle">
                      <span class="secure-badge" style="display:inline-block;padding:8px 12px;border:1px solid #23594b;border-radius:99px;background-color:#122b26;color:#80e5b0;font-size:10px;font-weight:800;letter-spacing:1.3px;white-space:nowrap;">
                        <span class="status-dot" style="display:inline-block;margin-right:6px;width:6px;height:6px;border-radius:50%;background:#4ade80;vertical-align:middle;"></span>SECURE
                      </span>
                    </td>
                  </tr>
                </table>
                <div style="position:relative;z-index:1;">
                  <p style="margin:35px 0 11px;font-size:11px;color:#9b96f9;letter-spacing:3px;font-weight:750;">IDENTITY VERIFICATION</p>
                  <h1 class="heading" style="margin:0;color:#f5f4ff;font-size:34px;line-height:1.3;font-weight:780;letter-spacing:-.9px;">你好，欢迎回来<span style="color:#a69dff;">.</span></h1>
                  <p style="margin:16px 0 0;color:#abb0c4;font-size:14px;line-height:1.95;">您正在登录或验证身份，请使用下方验证码继续。<br>此验证码仅用于本次安全验证。</p>
                </div>

                <div style="height:36px;"></div>
                <div class="code-shell" style="position:relative;border:1px solid #48416e;border-radius:22px;background-color:#171729;text-align:center;">
                  <div class="scan-beam" aria-hidden="true"></div>
                  <div class="code-inner" style="padding:30px 24px 26px;position:relative;z-index:1;">
                    <p style="margin:0 0 13px;color:#b6addb;font-size:11px;letter-spacing:3px;font-weight:750;">YOUR VERIFICATION CODE</p>
                    <!-- 验证码区域：由服务端注入真实验证码 -->
                    <span class="code-number" style="color:#dcd9ff;font-size:46px;font-weight:800;letter-spacing:10px;line-height:1.22;">{{code}}</span>
                    <p style="margin:16px 0 0;color:#9093b1;font-size:12px;">验证码有效期 <strong style="color:#c5bdff;">10 分钟</strong></p>
                  </div>
                </div>

                <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="width:100%;margin-top:31px;">
                  <tr>
                    <td align="left" style="font-size:12px;color:#aaaec5;font-weight:650;">验证码有效期</td>
                    <td align="right" style="font-size:12px;color:#c4bcff;font-weight:800;font-variant-numeric:tabular-nums;" id="timeRemaining">10:00</td>
                  </tr>
                </table>
                <div style="height:5px;background:#282a41;border-radius:99px;overflow:hidden;margin-top:13px;">
                  <div class="progress-fill" id="progressFill" style="height:100%;width:100%;background-color:#8b83ff;border-radius:99px;"></div>
                </div>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;margin-top:32px;border-collapse:separate;background:#191b2a;border:1px solid #292d43;border-radius:15px;">
                  <tr>
                    <td valign="top" width="38" style="padding:17px 0 17px 18px;color:#a49bff;font-size:19px;">◇</td>
                    <td style="padding:16px 17px 17px 0;color:#9a9db5;font-size:12px;line-height:1.9;">
                      <strong style="display:block;color:#dad7f7;font-size:12px;margin-bottom:3px;">安全提示</strong>
                      为保障账号安全，请勿向任何人透露验证码。如非本人操作，请忽略此邮件或及时修改密码。
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="card-footer" style="padding:0 45px 34px;">
                <div style="height:1px;background:#292b41;"></div>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;margin-top:19px;">
                  <tr>
                    <td align="left" style="color:#676c85;font-size:11px;line-height:1.7;">本邮件由 Breeze 安全验证系统自动发送，请勿回复。</td>
                    <td align="right" style="color:#676c85;font-size:11px;white-space:nowrap;padding-left:12px;">© Breeze</td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <p style="color:#51566c;font-size:11px;letter-spacing:1.1px;margin:25px 0 0;">BREEZE · TRUSTED SECURITY</p>
        </td>
      </tr>
    </table>
  </div>
  <!-- 浏览器增强：真实更新 10:00 倒计时。邮件客户端通常会忽略 script，CSS 动画仍可在支持的客户端播放。 -->
  <script>
    (function () {
      'use strict';
      var label = document.getElementById('timeRemaining');
      var bar = document.getElementById('progressFill');
      if (!label || !bar) return;
      var seconds = 600;
      var started = Date.now();
      // 浏览器使用 JS 与 CSS 进度动画共用时钟，避免定时器节流造成偏差。
      function tick() {
        var elapsed = Math.floor((Date.now() - started) / 1000);
        var remaining = Math.max(0, seconds - elapsed);
        var mm = String(Math.floor(remaining / 60)).padStart(2, '0');
        var ss = String(remaining % 60).padStart(2, '0');
        label.textContent = mm + ':' + ss;
        if (remaining === 0) label.style.color = '#fb7185';
      }
      tick();
      setInterval(tick, 250);
    })();
  </script>
</body>
</html>
