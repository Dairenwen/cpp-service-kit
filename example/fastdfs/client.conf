# 连接 Tracker 或 Storage 时的连接超时时间（秒）。
connect_timeout = 5
# 建立连接后，网络读写操作的超时时间（秒）。
network_timeout = 60
# Tracker 的地址和端口；dev-tracker 是本项目开发容器网络中的服务名。
tracker_server = dev-tracker:22122
# 启用客户端连接池，允许复用连接。
use_connection_pool = true
# 连接池中连接的最大空闲时间（秒）。
connection_pool_max_idle_time = 3600
# 客户端基础目录，必须是已存在的目录；这里使用容器内的 /tmp。
base_path = /tmp
