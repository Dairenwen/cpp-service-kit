<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你的验证码</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f5fb;font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',Arial,sans-serif;color:#1f2a44;">
  <!-- 使用表格和内联样式，提高常见邮件客户端的兼容性。 -->
  <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;background-color:#f3f5fb;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;border-collapse:collapse;background-color:#ffffff;border-radius:16px;">
          <tr>
            <td style="padding:36px 36px 0;">
              <span style="display:inline-block;padding:7px 12px;border-radius:20px;background-color:#eaf0ff;color:#4263cf;font-size:12px;font-weight:bold;letter-spacing:1px;">安全验证</span>
              <h1 style="margin:20px 0 12px;color:#1c2745;font-size:26px;line-height:1.4;">你好，欢迎回来 👋</h1>
              <p style="margin:0;color:#66718a;font-size:15px;line-height:1.8;">你正在进行身份验证，请使用下面的验证码完成操作。</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 36px;">
              <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;background-color:#f4f7ff;border:1px solid #dbe5ff;border-radius:12px;">
                <tr>
                  <td align="center" style="padding:22px 16px;">
                    <p style="margin:0 0 10px;color:#66718a;font-size:13px;">你的验证码</p>
                    <!-- 这是演示用固定验证码，可在此处修改。 -->
                    <p style="margin:0;color:#365bc8;font-size:36px;font-weight:bold;letter-spacing:10px;">5678</p>
                    <p style="margin:12px 0 0;color:#8792a8;font-size:12px;">验证码将在 5 分钟后失效</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 36px 34px;">
              <p style="margin:0;color:#66718a;font-size:14px;line-height:1.8;">请勿将验证码告诉他人。如果这不是你本人的操作，可以忽略此邮件。</p>
              <p style="margin:26px 0 0;padding-top:20px;border-top:1px solid #edf0f6;color:#a0a9ba;font-size:12px;line-height:1.7;">这是一封自动发送的演示邮件，祝你有美好的一天。</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
